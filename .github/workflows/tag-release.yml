name: Tag release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for a version change
        id: release
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --quiet "$TARGET_SHA^" "$TARGET_SHA" -- manifest.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Read manifest version
        if: steps.release.outputs.changed == 'true'
        id: manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"))
          const version = manifest.version

          if (typeof version !== "string" || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error("manifest.json version must use x.y.z")
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`)
          NODE

      - name: Create version tag
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          remote_tag_commit() {
            git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | node -e '
              let input = ""
              process.stdin.on("data", chunk => { input += chunk })
              process.stdin.on("end", () => {
                let direct = ""
                let peeled = ""
                for (const line of input.trim().split("\n")) {
                  if (!line) continue
                  const [sha, ref] = line.split(/\s+/)
                  if (ref.endsWith("^{}")) peeled = sha
                  else direct = sha
                }
                process.stdout.write(peeled || direct)
              })
            '
          }

          existing_commit="$(remote_tag_commit)"
          if [[ -n "$existing_commit" ]]; then
            if [[ "$existing_commit" == "$TARGET_SHA" ]]; then
              echo "$TAG already points to $TARGET_SHA; nothing to do"
              exit 0
            fi
            echo "$TAG points to $existing_commit, expected $TARGET_SHA" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"

          if git push origin "refs/tags/$TAG"; then
            exit 0
          fi

          [[ "$(remote_tag_commit)" == "$TARGET_SHA" ]]
