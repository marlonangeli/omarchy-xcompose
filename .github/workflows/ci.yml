name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: basecamp/omarchy
          ref: main
          path: omarchy-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck qt6-declarative-dev-tools
      - name: Run tests and manifest validation
        run: |
          bash tests/run
      - name: Lint scripts and QML
        run: |
          shellcheck scripts/* tests/*.sh
          qmllint -I "$GITHUB_WORKSPACE/omarchy-shell/shell" XComposeMenu.qml
      - name: Benchmark smoke test
        run: node bench/benchmark.js
      - name: Repository hygiene
        run: |
          test ! -e BACKLOG.md
          test ! -e DOCUMENTATION.md
          ! rg -n -i 'password|api[_-]?key|secret|token' --glob '!SECURITY.md' --glob '!*.md' .
