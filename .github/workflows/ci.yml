name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run tests
        run: tests/run
      - name: Lint
        run: scripts/lint
      - name: Benchmark smoke test
        run: node bench/benchmark.js
